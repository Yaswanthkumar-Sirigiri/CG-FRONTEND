<!DOCTYPE html>
<html lang="en">
<head>
    <form action="">
        <label for="">Full Name</label><br>
        <input type="text" placeholder="Enter your Full name" name="uname" required><br><br>

        <label for="">Email Address</label><br>
        <input type="email" placeholder="Enter email address"><br><br>

        <label for="">Password</label><br>
        <input type="password" placeholder="Enter password"><br><br>

        <label for="">Confirm Password</label><br>
        <input type="password" placeholder="confirm your password"><br><br>

        <div>Gender</div><br>
        <input type="radio" name=Gender value="Male" id="m">
        <label for="m">Male</label> 
        <input type="radio" name=Gender value="Female" id="Fm">
        <label for="Fm">Female</label>
        <input type="radio" name=Gender value="Others" id="O">
        <label for="O">Others</label>
        <br>
        <br>
        

        <label for="">Date of Birth</label><br>
        <input type="Date"><br><br>

        <label for="c">Country</label><br>
        <select name="Country" id="c">
            <option value="IN">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
        </select><br><br>

        <div>Select your Skills</div>
        <input type="checkbox" id="ht">
        <label for="ht">HTML</label><br>
        <input type="checkbox" id="cs">
        <label for="cs">CSS</label><br>
        <input type="checkbox" id="ja">
        <label for="ja">JAVA</label><br>
        <input type="checkbox" id="py">
        <label for="py">Python</label><br><br><br>

        <input type="checkbox" id="ch">
        <label for="ch">I agree to terms of services and privacy policies.</label><br><br>


        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <br><br>

    </form>
</head>

</html>
